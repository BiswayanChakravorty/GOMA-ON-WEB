<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05090d">
<meta name="description" content="GOMA — The Last Signal. Act I playable prototype.">
<title>GOMA — The Last Signal</title>
<link rel="stylesheet" href="./dist/tailwind.css">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="loading"><div class="loading-logo">GOMA</div><div>THE LAST SIGNAL</div><div class="loading-line"></div></div>
<canvas id="game"></canvas>

<section id="hud">
  <div class="topline"><strong>GOMA</strong><span>THE LAST SIGNAL</span><em id="chapter">PROLOGUE / 03:17</em></div>
  <div class="cards">
    <div><small>HEALTH</small><div class="bar"><i id="health"></i></div></div>
    <div class="cards ability-card"><small>RESONANCE</small><div class="bar signal"><i id="ability"></i></div></div>
    <div class="stat"><small>EVIDENCE</small><b id="evidence">0 EVIDENCE</b></div>
  </div>
  <div class="mission-card"><small id="mission">PROLOGUE</small><p id="objective"></p></div>
  <div id="prompt" class="hidden"></div>
  <div id="crosshair">·</div>
  <div id="toast"></div>
</section>

<div id="dialogue" class="hidden">
  <div class="dialogue-card">
    <div id="dialogueName">AARAV</div>
    <p id="dialogueText"></p>
    <small id="dialogueHint">CLICK / ENTER TO CONTINUE</small>
  </div>
</div>

<div id="menu">
  <div class="menu-card">
    <div class="eyebrow goma-kicker goma-glow">AN ORIGINAL 3D STORY GAME</div>
    <h1>GOMA</h1>
    <h2>THE LAST SIGNAL</h2>
    <p>A seven-day mystery begins at 03:17.</p>
    <button id="play" class="goma-btn goma-btn-primary">NEW STORY</button>
    <button id="continue" class="goma-btn">CONTINUE</button>
    <button id="new" class="goma-btn">RESET SAVE</button>
    <div class="controls"><b>WASD</b> move · <b>MOUSE</b> camera · <b>E</b> interact · <b>F / SPACE</b> fire · <b>ESC</b> pause</div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
