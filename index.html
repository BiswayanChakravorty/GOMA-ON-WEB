<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#090b10"/>
<title>GOMA — Open City</title>
<link rel="stylesheet" href="./style.css"/>
</head>
<body>
<div id="loading"><div class="loader-title">GOMA</div><div class="loader-sub">OPEN CITY</div><div class="loader-bar"><span></span></div></div>
<canvas id="game"></canvas>
<div id="hud">
  <div class="brand">GOMA <span>OPEN CITY</span></div>
  <div class="stats">
    <div><small>CASH</small><b id="cash">$0</b></div>
    <div><small>MISSION</small><b id="mission">FREE ROAM</b></div>
    <div><small>HEAT</small><b id="heat">☆☆☆☆☆</b></div>
  </div>
  <div id="missionBox" class="panel hidden"><div class="panel-title">MISSION</div><div id="missionText">—</div><div class="panel-hint">Reach the marked location</div></div>
</div>
<div id="help" class="panel"><b>GOMA</b><br/>WASD / arrows to move · SPACE to enter/exit vehicle<br/>E to start mission · R to reset</div>
<div id="touch">
  <div class="touch-left">
    <button data-key="ArrowUp">▲</button>
    <div><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div>
  </div>
  <div class="touch-right">
    <button id="action">ACTION</button>
  </div>
</div>
<div id="toast"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
